<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Board of Directors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #f8f9fa;
            padding: 40px 0;
        }
        .form-container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .form-title {
            color: #2c3e50;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e9ecef;
        }
        .form-control:focus {
            border-color: #4e73df;
            box-shadow: 0 0 0 0.2rem rgba(78,115,223,0.25);
        }
        .custom-file-input {
            border: 2px dashed #dee2e6;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .custom-file-input:hover {
            border-color: #4e73df;
            background-color: #f8f9fa;
        }
        .btn-submit {
            padding: 12px 30px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="form-container">
                    <h2 class="form-title text-center">
                        <i class="fas fa-user-tie me-2"></i>
                        Add Board of Directors
                    </h2>
                    <form action="insert.php" method="post" enctype="multipart/form-data">
                        <div class="mb-4">
                            <label for="exampleInputName" class="form-label">
                                <i class="fas fa-user me-2"></i>Name
                            </label>
                            <input type="text" class="form-control" id="exampleInputname" placeholder="Enter full name" />
                        </div>
                        <div class="mb-4">
                            <label for="exampleInputDegree" class="form-label">
                                <i class="fas fa-graduation-cap me-2"></i>Degree
                            </label>
                            <input type="text" class="form-control" id="exampleInputdegree" placeholder="Enter degree" />
                        </div>
                        <div class="mb-4">
                            <label for="exampleInputDesignation-Army" class="form-label">
                                <i class="fas fa-shield-alt me-2"></i>Designation of Army
                            </label>
                            <input type="text" class="form-control" id="exampleInputDesignation-Army" placeholder="Enter army designation" />
                        </div>
                        <div class="mb-4">
                            <label for="exampleInputDesignation-Trust" class="form-label">
                                <i class="fas fa-building-columns me-2"></i>Designation of Trust Bank
                            </label>
                            <input type="text" class="form-control" id="exampleInputDesignation-Trust" placeholder="Enter trust bank designation" />
                        </div>
                        <div class="mb-4">
                            <label for="myfile" class="form-label">
                                <i class="fas fa-image me-2"></i>Profile Image
                            </label>
                            <div class="custom-file-input">
                                <input type="file" id="myfile" name="myfile" class="d-none" />
                                <label for="myfile" class="mb-0">
                                    <i class="fas fa-cloud-upload-alt fa-2x mb-2"></i>
                                    <p class="mb-0">Drop your image here or click to browse</p>
                                </label>
                            </div>
                        </div>
                        <div class="text-center mt-5">
                            <button type="submit" class="btn btn-primary btn-submit">
                                <i class="fas fa-save me-2"></i>Submit
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
